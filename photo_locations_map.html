const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showError(msg){const m=document.getElementById('msg');m.textContent=msg;m.style.display='flex'}

// Work out a camera that frames every photo: average position, then distance to the farthest photo.
function homeView(){
  const R=Math.PI/180;let x=0,y=0,z=0;
  pts.forEach(p=>{const a=p.lat*R,b=p.lon*R;x+=Math.cos(a)*Math.cos(b);y+=Math.cos(a)*Math.sin(b);z+=Math.sin(a)});
  const L=Math.hypot(x,y,z)||1;x/=L;y/=L;z/=L;
  const lat=Math.asin(z)/R,lon=Math.atan2(y,x)/R;
  let far=0;
  pts.forEach(p=>{const a=p.lat*R,b=p.lon*R;const d=Math.acos(Math.min(1,Math.max(-1,Math.cos(a)*Math.cos(b)*x+Math.cos(a)*Math.sin(b)*y+Math.sin(a)*z)));far=Math.max(far,d)});
  const range=Math.min(28e6,Math.max(2e6,(far*6371000*1.5)/Math.tan(17.5*R)));
  return {center:{lat,lng:lon,altitude:0},range,tilt:0,heading:0};
}

let map,home;
async function initMap(){
  try{
    const {Map3DElement,Marker3DInteractiveElement}=await google.maps.importLibrary('maps3d');
    const {PinElement}=await google.maps.importLibrary('marker');
    home=homeView();
    map=new Map3DElement({mode:'HYBRID',center:home.center,range:home.range,tilt:0,heading:0});
    map.addEventListener('gmp-error',()=>showError('The 3D map could not start. Check your API key, that the Maps JavaScript API is enabled, and that this page\'s address is allowed by the key\'s referrer restriction.'));
    document.getElementById('map').appendChild(map);
    pts.forEach(d=>{
      const pin=new PinElement({background:COLORS[d.g],borderColor:'#ffffff',glyphColor:'#ffffff',scale:.8});
      const m=new Marker3DInteractiveElement({position:{lat:d.lat,lng:d.lon},title:d.f,sizePreserved:true,drawsWhenOccluded:true});
      m.append(pin);m.group=d.g;
      m.addEventListener('gmp-click',()=>select(d));
      markers.push(m);map.append(m);
    });
  }catch(e){console.error(e);showError('The 3D map library failed to load. Check the browser console for details.')}
}

function select(d){
  const p=document.getElementById('panel');
  p.innerHTML='<button type="button" aria-label="Close" id="x">&times;</button><b>'+esc(d.f)+'</b><br>'+d.lat+', '+d.lon+(d.c?'<br>'+esc(d.c):'')+(d.alt?'<br>Alt '+esc(d.alt):'')+(d.d?'<br>'+esc(d.d):'')+'<br><a href="https://www.google.com/maps?q='+d.lat+','+d.lon+'" target="_blank" rel="noopener">Open in Google Maps</a>';
  p.style.display='block';
  document.getElementById('x').onclick=()=>{p.style.display='none'};
  map.flyCameraTo({endCamera:{center:{lat:d.lat,lng:d.lon,altitude:0},range:2500,tilt:55,heading:0},durationMillis:2500});
}

document.getElementById('home').onclick=()=>{if(map){document.getElementById('panel').style.display='none';map.flyCameraTo({endCamera:home,durationMillis:2500})}};
document.getElementById('mode').onchange=e=>{if(map)map.mode=e.target.value};
document.querySelectorAll('#legend input').forEach(cb=>cb.addEventListener('change',()=>{
  markers.filter(m=>m.group===cb.dataset.k).forEach(m=>{cb.checked?map.append(m):m.remove()});
}));

window.gm_authFailure=()=>showError('Google Maps rejected the API key. Check GOOGLE_MAPS_API_KEY in this file and that the Maps JavaScript API is enabled.');
if(GOOGLE_MAPS_API_KEY==='YOUR_API_KEY_HERE'){
  showError('Add your Google Maps API key: open this file in a text editor and replace YOUR_API_KEY_HERE near the top of the script.');
}else{
  window.initMap=initMap;
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&callback=initMap&loading=async&v=weekly';
  s.async=true;document.head.appendChild(s);
}
